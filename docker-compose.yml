services:
  mcphub:
    build: .
    image: mcphub:latest
    # Stesso nome del container avviato a mano in produzione: compose lo sostituisce.
    container_name: mcphub
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCPHUB_PORT:-8070}:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DATA_DIR=/data
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-28800}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-admin}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
    volumes:
      # Cartella sull'host (non volume nominato): non dipende dal nome della cartella del
      # progetto, quindi un deploy da un percorso diverso ritrova sempre gli stessi dati.
      - ${MCPHUB_DATA_DIR:-/var/lib/mcphub-data}:/data
